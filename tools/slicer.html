<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>스프라이트 슬라이서</title>
<style>
  :root { --bg: #151826; --panel: #1f2336; --line: #343a55; --text: #e8ebf5; --dim: #9aa3bf; --accent: #ffd23f; --bad: #ff6b6b; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
  header { padding: 12px 16px; border-bottom: 1px solid var(--line); display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap; }
  header h1 { font-size: 18px; margin: 0; }
  header span { color: var(--dim); font-size: 13px; }
  main { display: grid; grid-template-columns: 300px 1fr; gap: 16px; padding: 16px; }
  @media (max-width: 800px) { main { grid-template-columns: 1fr; } }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
  label { display: block; margin: 10px 0 4px; color: var(--dim); font-size: 12px; }
  input[type=text], select, input[type=number] { width: 100%; padding: 6px 8px; background: #11131f; color: var(--text); border: 1px solid var(--line); border-radius: 6px; }
  input[type=range] { width: 100%; }
  .btns { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
  button { background: #2c3250; color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 7px 10px; cursor: pointer; }
  button.primary { background: var(--accent); color: #1c1a2b; border-color: var(--accent); font-weight: 700; }
  button.on { outline: 2px solid var(--accent); }
  #report { white-space: pre-wrap; font-size: 12px; color: var(--dim); margin-top: 10px; }
  #report .bad { color: var(--bad); }
  .views { display: grid; grid-template-columns: minmax(0, 1fr) 260px; gap: 16px; }
  @media (max-width: 1100px) { .views { grid-template-columns: 1fr; } }
  .checker { background-color: #2a2e44; background-image: linear-gradient(45deg, #343954 25%, transparent 25%, transparent 75%, #343954 75%), linear-gradient(45deg, #343954 25%, transparent 25%, transparent 75%, #343954 75%); background-size: 16px 16px; background-position: 0 0, 8px 8px; border-radius: 8px; }
  canvas { display: block; max-width: 100%; }
  h2 { font-size: 14px; margin: 0 0 8px; color: var(--dim); font-weight: 600; }
  .row { display: flex; gap: 8px; align-items: center; }
  .row > * { flex: 1; }
  #anim-btns { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 8px; }
</style>
</head>
<body>
<header>
  <h1>스프라이트 슬라이서</h1>
  <span>시트 → 마젠타 제거 → 덩어리 검출 → 발 기준 정렬 → 아틀라스(PNG+JSON). 결과는 assets/sprites/ 에 넣는다.</span>
</header>
<main>
  <section class="panel">
    <label>프리셋 (tools/sheets.json)</label>
    <select id="preset"></select>
    <label>또는 시트 파일 직접 열기</label>
    <input type="file" id="file" accept="image/*">
    <label>캐릭터 ID (저장 파일 이름)</label>
    <input type="text" id="cid" value="new_char">
    <label>배경 허용 오차 <b id="tol-v"></b></label>
    <input type="range" id="tolerance" min="30" max="200" value="100">
    <label>경계 부드럽게 <b id="soft-v"></b></label>
    <input type="range" id="soft" min="5" max="100" value="40">
    <label>흰 테두리 제거 횟수 <b id="halo-v"></b></label>
    <input type="range" id="halo" min="0" max="10" value="0">
    <div class="row">
      <div><label>행별 프레임 수</label><input type="text" id="expected" value="4,4,4,4,4,3"></div>
      <div><label>기준 높이(px)</label><input type="number" id="targetHeight" value="160"></div>
    </div>
    <label>좌우반전할 프레임 번호 (예: 15,18)</label>
    <input type="text" id="flip" value="">
    <label>무시할 영역 JSON (0~1 비율, 예: [[0.8,0.9,1,1]])</label>
    <input type="text" id="ignore" value="[]">
    <label>애니메이션 매핑 JSON (비우면 행 순서대로 idle/walk/windup/throw/hit/jump)</label>
    <input type="text" id="anims" value="">
    <div class="btns">
      <button class="primary" id="run">자르기</button>
      <button id="save-png">PNG 저장</button>
      <button id="save-json">JSON 저장</button>
      <button id="copy-preset">설정 복사</button>
    </div>
    <div id="report"></div>
  </section>
  <section class="views">
    <div class="panel">
      <h2>아틀라스 (번호 = 프레임 인덱스)</h2>
      <div class="checker"><canvas id="atlas-view"></canvas></div>
      <h2 style="margin-top:14px">원본 검출 결과</h2>
      <canvas id="sheet-view"></canvas>
    </div>
    <div class="panel">
      <h2>애니메이션 미리보기</h2>
      <div id="anim-btns"></div>
      <div class="checker"><canvas id="anim-view" width="240" height="240"></canvas></div>
    </div>
  </section>
</main>
<pre id="batch-out" hidden></pre>

<script type="module">
import { loadImage, sliceSheet, DEFAULTS } from './slicer-core.js';

const $ = (id) => document.getElementById(id);
let presets = { sheets: [] };
let img = null, result = null, curAnim = 'idle';

async function init() {
  try { presets = await (await fetch('sheets.json', { cache: 'no-cache' })).json(); } catch { /* 프리셋 없음 */ }
  if (new URLSearchParams(location.search).has('batch')) return runBatch();
  $('preset').innerHTML = '<option value="">(선택)</option>' + presets.sheets.map((s, i) => `<option value="${i}">${s.id}</option>`).join('');
  for (const id of ['tolerance', 'soft', 'halo']) $(id).addEventListener('input', showValues);
  showValues();
  $('preset').addEventListener('change', async () => {
    const p = presets.sheets[$('preset').value];
    if (!p) return;
    applyPreset(p);
    img = await loadImage(encodeURI(p.src));
    run();
  });
  $('file').addEventListener('change', async () => {
    const f = $('file').files[0];
    if (!f) return;
    img = await loadImage(URL.createObjectURL(f));
    run();
  });
  $('run').addEventListener('click', run);
  $('save-png').addEventListener('click', () => result && download(result.atlas.toDataURL('image/png'), `${$('cid').value}.png`));
  $('save-json').addEventListener('click', () => result && download('data:application/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(result.meta, null, 2)), `${$('cid').value}.json`));
  $('copy-preset').addEventListener('click', () => navigator.clipboard?.writeText(JSON.stringify({ id: $('cid').value, ...readOptions() }, null, 2)));
  const p = new URLSearchParams(location.search).get('preset');
  if (p) {
    const i = presets.sheets.findIndex((s) => s.id === p);
    if (i >= 0) { $('preset').value = i; $('preset').dispatchEvent(new Event('change')); }
  }
  requestAnimationFrame(animLoop);
}

function showValues() {
  $('tol-v').textContent = $('tolerance').value;
  $('soft-v').textContent = $('soft').value;
  $('halo-v').textContent = $('halo').value;
}

function applyPreset(p) {
  const o = { ...DEFAULTS, targetHeight: presets.targetHeight || DEFAULTS.targetHeight, ...p };
  $('cid').value = p.id;
  $('tolerance').value = o.tolerance;
  $('soft').value = o.soft;
  $('halo').value = o.halo;
  $('expected').value = o.expected.join(',');
  $('targetHeight').value = o.targetHeight;
  $('flip').value = o.flip.join(',');
  $('ignore').value = JSON.stringify(o.ignore);
  $('anims').value = p.anims ? JSON.stringify(p.anims) : '';
  showValues();
}

function readOptions() {
  const nums = (s) => s.split(',').map((x) => parseInt(x, 10)).filter((x) => !isNaN(x));
  const o = {
    tolerance: +$('tolerance').value,
    soft: +$('soft').value,
    halo: +$('halo').value,
    expected: nums($('expected').value),
    targetHeight: +$('targetHeight').value || 160,
    flip: nums($('flip').value),
  };
  try { o.ignore = JSON.parse($('ignore').value || '[]'); } catch { o.ignore = []; }
  if ($('anims').value.trim()) { try { o.anims = JSON.parse($('anims').value); } catch { /* 무시 */ } }
  return o;
}

function run() {
  if (!img) return;
  result = sliceSheet(img, readOptions());
  const r = result.report;
  $('report').innerHTML =
    `원본 ${r.size[0]}×${r.size[1]} · 배경색 rgb(${r.key.join(',')})\n` +
    `덩어리 ${r.blobs}개 → 프레임 ${result.frames.length}개 (병합 ${r.merged}, 버림 ${r.dropped})\n` +
    `행별: ${r.rows.join(' / ')}\n` +
    `칸 크기 ${result.meta.cellW}×${result.meta.cellH}` +
    r.warnings.map((w) => `\n<span class="bad">⚠ ${w}</span>`).join('');
  drawAtlasView();
  drawSheetView();
  $('anim-btns').innerHTML = Object.keys(result.meta.anims).map((k) => `<button data-a="${k}" class="${k === curAnim ? 'on' : ''}">${k}</button>`).join('');
  $('anim-btns').querySelectorAll('button').forEach((b) => b.addEventListener('click', () => {
    curAnim = b.dataset.a;
    $('anim-btns').querySelectorAll('button').forEach((x) => x.classList.toggle('on', x === b));
  }));
}

function drawAtlasView() {
  const { atlas, meta } = result;
  const c = $('atlas-view');
  c.width = atlas.width;
  c.height = atlas.height;
  const g = c.getContext('2d');
  g.drawImage(atlas, 0, 0);
  g.strokeStyle = 'rgba(255,210,63,0.5)';
  g.fillStyle = '#ffd23f';
  g.font = 'bold 14px sans-serif';
  for (let i = 0; i < meta.frames; i++) {
    const x = (i % meta.cols) * meta.cellW, y = Math.floor(i / meta.cols) * meta.cellH;
    g.strokeRect(x + 0.5, y + 0.5, meta.cellW - 1, meta.cellH - 1);
    g.fillText(String(i), x + 4, y + 16);
    g.beginPath();
    g.moveTo(x + meta.anchorX - 6, y + meta.anchorY);
    g.lineTo(x + meta.anchorX + 6, y + meta.anchorY);
    g.stroke();
  }
}

function drawSheetView() {
  const c = $('sheet-view');
  const s = Math.min(1, 520 / img.naturalWidth);
  c.width = Math.round(img.naturalWidth * s);
  c.height = Math.round(img.naturalHeight * s);
  const g = c.getContext('2d');
  g.drawImage(img, 0, 0, c.width, c.height);
  g.strokeStyle = '#00e5ff';
  g.lineWidth = 2;
  g.fillStyle = '#00e5ff';
  g.font = 'bold 13px sans-serif';
  result.frames.forEach((f, i) => {
    g.strokeRect(f.sheet.x * s, f.sheet.y * s, f.sheet.w * s, f.sheet.h * s);
    g.fillText(String(i), f.sheet.x * s + 3, f.sheet.y * s + 14);
  });
}

function animLoop(t) {
  requestAnimationFrame(animLoop);
  if (!result) return;
  const { atlas, meta } = result;
  const list = meta.anims[curAnim];
  if (!list || !list.length) return;
  const c = $('anim-view'), g = c.getContext('2d');
  g.clearRect(0, 0, c.width, c.height);
  const f = list[Math.floor(t / 1000 * 6) % list.length];
  const s = Math.min(1, 200 / meta.refHeight);
  const sx = (f % meta.cols) * meta.cellW, sy = Math.floor(f / meta.cols) * meta.cellH;
  const ox = c.width / 2, oy = c.height - 20;
  g.drawImage(atlas, sx, sy, meta.cellW, meta.cellH, ox - meta.anchorX * s, oy - meta.anchorY * s, meta.cellW * s, meta.cellH * s);
  g.strokeStyle = 'rgba(255,255,255,0.4)';
  g.beginPath();
  g.moveTo(0, oy + 0.5);
  g.lineTo(c.width, oy + 0.5);
  g.stroke();
}

function download(url, name) {
  const a = document.createElement('a');
  a.href = url;
  a.download = name;
  a.click();
}

// ?batch → sheets.json 전체를 처리해 결과를 <pre id="batch-out"> 에 JSON으로 출력 (자동화용)
async function runBatch() {
  const out = [];
  for (const p of presets.sheets) {
    try {
      const im = await loadImage(encodeURI(p.src));
      const r = sliceSheet(im, { targetHeight: presets.targetHeight, ...p });
      out.push({ id: p.id, png: r.atlas.toDataURL('image/png'), meta: JSON.stringify(r.meta, null, 2), report: r.report });
    } catch (e) {
      out.push({ id: p.id, error: String(e) });
    }
  }
  $('batch-out').textContent = JSON.stringify(out);
  document.title = 'batch-done';
}

init();
</script>
</body>
</html>
